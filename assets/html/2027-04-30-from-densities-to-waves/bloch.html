<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloch sphere</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6a737d; --grid:#d5d9de; --panel:#fafbfc; --fr:#ff7f0e; --sgn:#d62728; --fs:#1f77b4; --h:#c2185b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f1115; --fg:#e6e8eb; --muted:#9aa4af; --grid:#3a414b; --panel:#161a20; --fr:#ffa04a; --sgn:#ff6b6b; --fs:#5aa7e0; --h:#f06292; } }
  :root[data-theme="dark"] { --bg:#0f1115; --fg:#e6e8eb; --muted:#9aa4af; --grid:#3a414b; --panel:#161a20; --fr:#ffa04a; --sgn:#ff6b6b; --fs:#5aa7e0; --h:#f06292; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:8px 16px 10px; box-sizing:border-box; display:grid; grid-template-columns:1fr 330px; gap:14px; }
  canvas { width:100%; height:430px; display:block; background:var(--panel); border:1px solid var(--grid); border-radius:4px; cursor:grab; touch-action:none; }
  .side { display:flex; flex-direction:column; gap:7px; font-size:13px; }
  .side h4 { margin:6px 0 0; font-size:13px; }
  .side label { display:grid; grid-template-columns:62px 1fr 46px; align-items:center; gap:6px; }
  .val { font-variant-numeric:tabular-nums; color:var(--muted); text-align:right; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:12.5px; color:var(--fg); background:var(--panel); border:1px solid var(--grid); border-radius:6px; padding:3px 8px; cursor:pointer; }
  .read { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.55; }
  .read b { color:var(--fg); }
  .key span { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }
  @media (max-width:700px) { .wrap { grid-template-columns:1fr; } canvas { height:340px; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv"></canvas>
  <div class="side">
    <div class="btns">
      <button data-p="real">two nonnegative states</button>
      <button data-p="phase">same density, other phase</button>
      <button data-p="gen">two complex states</button>
    </div>
    <h4>state ψ₀ = (cos θ/2, e<sup>iφ</sup> sin θ/2)</h4>
    <label>θ₀ <input id="t0" type="range" min="0" max="180" step="1"><span class="val" id="t0v"></span></label>
    <label>φ₀ <input id="f0" type="range" min="-180" max="180" step="1"><span class="val" id="f0v"></span></label>
    <h4>state ψ₁</h4>
    <label>θ₁ <input id="t1" type="range" min="0" max="180" step="1"><span class="val" id="t1v"></span></label>
    <label>φ₁ <input id="f1" type="range" min="-180" max="180" step="1"><span class="val" id="f1v"></span></label>
    <h4>a Schrödinger path ψ₀ → ψ₁</h4>
    <label>axis tilt <input id="b" type="range" min="-80" max="80" step="1" value="45"><span class="val" id="bv"></span></label>
    <div class="read key">
      <div><span style="background:var(--fr)"></span>nonnegative amplitudes (Fisher–Rao)</div>
      <div><span style="background:var(--sgn)"></span>the rest of the signed real slice</div>
      <div><span style="background:var(--fs)"></span>Fubini–Study geodesic</div>
      <div><span style="background:var(--h)"></span>Schrödinger path for the tilted axis</div>
    </div>
    <div class="read" id="read"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id), D = Math.PI / 180;
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const n = Math.hypot(...a); return n < 1e-12 ? [0, 0, 0] : sc(a, 1 / n); };
  const bloch = (th, ph) => [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
  function rot(v, n, a) { // Rodrigues
    const c = Math.cos(a), s = Math.sin(a); return add(add(sc(v, c), sc(cross(n, v), s)), sc(n, dot(n, v) * (1 - c))); }
  let yaw = -35 * D, pitch = 18 * D;
  function view(v) { // rotate world -> camera (z up in world)
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const x1 = cy * v[0] - sy * v[1], y1 = sy * v[0] + cy * v[1], z1 = v[2];
    return [x1, cp * z1 - sp * y1, sp * z1 + cp * y1]; } // screen x, screen up, depth (toward viewer +)
  function setup(cv) { const r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * r) || cv.height !== Math.round(h * r)) { cv.width = Math.round(w * r); cv.height = Math.round(h * r); }
    const g = cv.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0); g.clearRect(0, 0, w, h); g.font = "13px system-ui, sans-serif"; return [g, w, h]; }

  function render() {
    const th0 = +$("t0").value * D, ph0 = +$("f0").value * D, th1 = +$("t1").value * D, ph1 = +$("f1").value * D, beta = +$("b").value * D;
    for (const id of ["t0", "f0", "t1", "f1", "b"]) $(id + "v").textContent = $(id).value + "°";
    const a = bloch(th0, ph0), b = bloch(th1, ph1);
    const [g, w, h] = setup($("cv")), R = Math.min(w, h) * 0.34, cx = w / 2, cy = h / 2 + 4;
    const P = (v) => { const q = view(v); return [cx + R * q[0], cy - R * q[1], q[2]]; };
    function curve(pts, col, lw, dash) { // split into front/back
      for (const front of [false, true]) { g.beginPath(); let on = false;
        for (const p of pts) { const q = P(p); if ((q[2] >= 0) === front) { on ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); on = true; } else on = false; }
        g.strokeStyle = col; g.lineWidth = front ? lw : Math.max(1, lw * 0.6); g.globalAlpha = front ? 1 : 0.28; g.setLineDash(dash || []); g.stroke(); }
      g.globalAlpha = 1; g.setLineDash([]); }
    // sphere
    g.strokeStyle = css("--grid"); g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, R, 0, 2 * Math.PI); g.stroke();
    for (const lat of [-60, -30, 0, 30, 60]) { const pts = []; for (let i = 0; i <= 96; i++) pts.push(bloch((90 - lat) * D, i / 96 * 2 * Math.PI)); curve(pts, css("--grid"), 1); }
    for (const lon of [45, 90, 135]) { const pts = []; for (let i = 0; i <= 96; i++) pts.push(bloch(i / 96 * 2 * Math.PI, lon * D)); curve(pts, css("--grid"), 1); }
    // z axis = density axis
    const zt = P([0, 0, 1.28]), zb = P([0, 0, -1.28]);
    g.strokeStyle = css("--muted"); g.lineWidth = 1; g.beginPath(); g.moveTo(zb[0], zb[1]); g.lineTo(zt[0], zt[1]); g.stroke();
    g.fillStyle = css("--muted"); g.textAlign = "center";
    g.fillText("all mass on point 1", zt[0], zt[1] - 6); g.fillText("all mass on point 2", zb[0], zb[1] + 16);
    // real slices
    const fr = [], sg = [];
    for (let i = 0; i <= 96; i++) { fr.push(bloch(i / 96 * Math.PI, 0)); sg.push(bloch(i / 96 * Math.PI, Math.PI)); }
    curve(sg, css("--sgn"), 2.2, [5, 4]); curve(fr, css("--fr"), 4);
    // Schrödinger path: rotation about n(beta) carrying a to b
    const ang = Math.acos(Math.max(-1, Math.min(1, dot(a, b))));
    let nG = norm(cross(a, b)), m = norm(add(a, b));
    if (Math.hypot(...nG) < 1e-9) nG = norm(cross(a, Math.abs(a[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
    if (Math.hypot(...m) < 1e-9) m = norm(cross(nG, a));
    const n = norm(add(sc(nG, Math.cos(beta)), sc(m, Math.sin(beta))));
    const ap = add(a, sc(n, -dot(n, a))), bp = add(b, sc(n, -dot(n, b)));
    let alpha = Math.atan2(dot(n, cross(ap, bp)), dot(ap, bp)); if (alpha < 0) alpha += 2 * Math.PI;
    const hp = []; for (let i = 0; i <= 120; i++) hp.push(rot(a, n, alpha * i / 120));
    curve(hp, css("--h"), 2.4);
    const lenH = alpha * Math.hypot(...ap);
    // geodesic
    const gp = []; for (let i = 0; i <= 120; i++) gp.push(rot(a, nG, ang * i / 120)); curve(gp, css("--fs"), 4);
    // axis of the Schrödinger rotation
    const n0 = P([0, 0, 0]), n1 = P(sc(n, 1.0));
    g.strokeStyle = css("--h"); g.lineWidth = 1; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(n0[0], n0[1]); g.lineTo(n1[0], n1[1]); g.stroke(); g.setLineDash([]);
    g.fillStyle = css("--h"); g.fillText("H axis", n1[0], n1[1] - 6);
    for (const [v, lab] of [[a, "ψ₀"], [b, "ψ₁"]]) { const q = P(v); g.globalAlpha = q[2] >= 0 ? 1 : 0.45;
      g.fillStyle = css("--fg"); g.beginPath(); g.arc(q[0], q[1], 6, 0, 7); g.fill(); g.textAlign = "left"; g.fillText(lab, q[0] + 9, q[1] - 8); g.globalAlpha = 1; }
    const mu = (th) => [Math.cos(th / 2) ** 2, Math.sin(th / 2) ** 2];
    const m0 = mu(th0), m1 = mu(th1), BC = Math.sqrt(m0[0] * m1[0]) + Math.sqrt(m0[1] * m1[1]);
    $("read").innerHTML =
      `densities: μ₀ = (${m0[0].toFixed(2)}, ${m0[1].toFixed(2)}), μ₁ = (${m1[0].toFixed(2)}, ${m1[1].toFixed(2)})<br>` +
      `Fubini–Study distance = ½ × angle = <b>${(ang / 2).toFixed(3)}</b><br>` +
      `Fisher–Rao distance of the densities = ½ × 2 arccos BC = <b>${Math.acos(Math.min(1, BC)).toFixed(3)}</b><br>` +
      `path lengths (FS units): geodesic <b>${(ang / 2).toFixed(3)}</b>, Schrödinger <b>${(lenH / 2).toFixed(3)}</b>`;
  }
  const presets = { real: [40, 0, 130, 0], phase: [70, -60, 70, 80], gen: [50, -40, 120, 110] };
  function setP(k) { const [a, b, c, d] = presets[k]; $("t0").value = a; $("f0").value = b; $("t1").value = c; $("f1").value = d; render(); }
  document.querySelectorAll("button[data-p]").forEach((el) => el.onclick = () => setP(el.dataset.p));
  for (const id of ["t0", "f0", "t1", "f1", "b"]) $(id).oninput = render;
  const cv = $("cv"); let dragging = null;
  cv.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY, yaw, pitch]; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", (e) => { if (!dragging) return; yaw = dragging[2] + (e.clientX - dragging[0]) * 0.008;
    pitch = Math.max(-1.4, Math.min(1.4, dragging[3] + (e.clientY - dragging[1]) * 0.008)); render(); });
  cv.addEventListener("pointerup", () => { dragging = null; cv.style.cursor = "grab"; });
  window.addEventListener("resize", render);
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  setP("real");
})();
</script>
</body>
</html>
